spring:
  application: { name: dlt-predictor }
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dlt}
    username: ${SPRING_DATASOURCE_USERNAME:dlt}
    password: ${SPRING_DATASOURCE_PASSWORD:dlt}
  jpa: { hibernate: { ddl-auto: validate }, open-in-view: false }
  flyway: { enabled: true }
server: { port: 8080 }
management: { endpoints: { web: { exposure: { include: health,info } } } }
