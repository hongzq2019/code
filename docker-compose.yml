services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: "${POSTGRES_DB:-dlt}", POSTGRES_USER: "${POSTGRES_USER:-dlt}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}" }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB], interval: 10s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
    volumes: [redis_data:/data]
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: minio server /minio_data
    environment: { MINIO_ACCESS_KEY: minioadmin, MINIO_SECRET_KEY: minioadmin }
  milvus:
    image: milvusdb/milvus:v2.4.6
    command: [milvus, run, standalone]
    environment: { ETCD_ENDPOINTS: etcd:2379, MINIO_ADDRESS: minio:9000 }
    depends_on: [etcd,minio]
  backend:
    build: ./backend
    environment: { SPRING_PROFILES_ACTIVE: prod, SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dlt}", SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-dlt}", SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}", BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}", JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}", REDIS_HOST: redis, MILVUS_HOST: milvus }
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started }, milvus: { condition: service_started } }
  frontend:
    build: ./forend
    ports: ["${HTTP_PORT:-8088}:80"]
    depends_on: [backend]
volumes: { postgres_data: {}, redis_data: {} }
